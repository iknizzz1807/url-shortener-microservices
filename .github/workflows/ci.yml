name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-lint-and-test:
    name: Go Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify Go format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following Go files are not formatted correctly. Please run 'go fmt ./...':"
            gofmt -l -d .
            exit 1
          fi

      - name: Run Vet and Tests
        run: |
          # Retrieve module directories from go.work and run vet & tests on each
          for dir in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            echo "::group::Module: $dir"
            echo "Running go vet on ./$dir/..."
            go vet "./$dir/..."
            echo "Running go test on ./$dir/..."
            go test -v -race -cover "./$dir/..."
            echo "::endgroup::"
          done

  frontend-build:
    name: Frontend Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-compose-check:
    name: Docker Compose Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker services
        run: docker compose build
